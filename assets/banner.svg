<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wire-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      .node-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: pulse2 5s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 12;
        animation: flow 20s linear infinite;
      }
      .particle-pulse {
        animation: particleGlow 3s ease-in-out infinite alternate;
      }
      @keyframes flow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.6; }
        100% { transform: translateY(-8px) scale(1.02); opacity: 0.9; }
      }
      @keyframes pulse2 {
        0% { transform: translateY(0px) scale(1); opacity: 0.5; }
        100% { transform: translateY(8px) scale(1.03); opacity: 0.85; }
      }
      @keyframes particleGlow {
        0% { opacity: 0.3; r: 3px; }
        100% { opacity: 0.9; r: 5px; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow-blur)"/>
  <circle cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.09" filter="url(#glow-blur)"/>
  <circle cx="600" cy="40" r="180" fill="#c084fc" opacity="0.07" filter="url(#glow-blur)"/>

  <!-- Dynamic Animated Graph Connectors (Workflow Rails in Background) -->
  <g class="dash-flow" fill="none" stroke="url(#wire-glow)" stroke-width="2.5">
    <!-- Left to Right Flow Lines -->
    <path d="M 60,80 C 220,40 280,140 440,110 S 760,60 920,120 S 1080,80 1160,110"/>
    <path d="M 40,280 C 180,310 320,230 480,260 S 820,330 980,260 S 1120,310 1170,280"/>
    <path d="M 140,40 C 200,160 220,220 280,320"/>
    <path d="M 1060,40 C 980,160 980,220 920,320"/>
  </g>

  <!-- Dynamic Agent Node 1: Left Top (LLM Trigger) -->
  <g class="node-pulse" style="transform-origin: 150px 100px;">
    <rect x="70" y="70" width="160" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" filter="url(#soft-shadow)"/>
    <circle cx="96" cy="100" r="10" fill="url(#accent-cyan)"/>
    <text x="118" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">LLM Prompt Engine</text>
    <text x="118" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">Autonomous Trigger</text>
  </g>

  <!-- Dynamic Agent Node 2: Left Bottom (RAG Knowledge Base) -->
  <g class="node-pulse-2" style="transform-origin: 160px 260px;">
    <rect x="80" y="230" width="160" height="60" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.85" filter="url(#soft-shadow)"/>
    <circle cx="106" cy="260" r="10" fill="url(#accent-purple)"/>
    <text x="128" y="256" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Vector Knowledge</text>
    <text x="128" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">RAG Context Index</text>
  </g>

  <!-- Dynamic Agent Node 3: Right Top (MCP Tools Server) -->
  <g class="node-pulse-2" style="transform-origin: 1040px 100px;">
    <rect x="960" y="70" width="170" height="60" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" opacity="0.85" filter="url(#soft-shadow)"/>
    <circle cx="986" cy="100" r="10" fill="url(#accent-purple)"/>
    <text x="1008" y="96" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">MCP Tool Protocol</text>
    <text x="1008" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">Dynamic API Calls</text>
  </g>

  <!-- Dynamic Agent Node 4: Right Bottom (HITL Guardrails) -->
  <g class="node-pulse" style="transform-origin: 1030px 260px;">
    <rect x="950" y="230" width="170" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" filter="url(#soft-shadow)"/>
    <circle cx="976" cy="260" r="10" fill="url(#accent-cyan)"/>
    <text x="998" y="256" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">HITL Verification</text>
    <text x="998" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">Human-In-The-Loop</text>
  </g>

  <!-- Floating Glowing Particles / Data Packets -->
  <circle class="particle-pulse" cx="360" cy="88" r="4" fill="#38bdf8"/>
  <circle class="particle-pulse" cx="420" cy="275" r="4" fill="#818cf8"/>
  <circle class="particle-pulse" cx="840" cy="95" r="4" fill="#c084fc"/>
  <circle class="particle-pulse" cx="780" cy="285" r="4" fill="#38bdf8"/>

  <!-- FOREGROUND CONTAINER: Darkened Center Backdrop to guarantee perfect readability -->
  <rect x="250" y="45" width="700" height="270" rx="20" fill="#090d16" fill-opacity="0.92" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>

  <!-- FOREGROUND TEXT (Crisp, Unobstructed, Centered) -->
  <g text-anchor="middle">
    <!-- Category Badge Pill -->
    <rect x="440" y="70" width="320" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="600" y="89" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="152" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Awesome AI Workflow &amp; Agent Builders</text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Visual Flow Orchestration • Multi-Agent Systems • Autonomous Workflows</text>

    <!-- Tags Row in Foreground -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
      <!-- Tag 1 -->
      <rect x="330" y="235" width="115" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="387" y="252" fill="#93c5fd">🤖 Multi-Agent</text>

      <!-- Tag 2 -->
      <rect x="460" y="235" width="115" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="517" y="252" fill="#c7d2fe">🎨 Visual Canvas</text>

      <!-- Tag 3 -->
      <rect x="590" y="235" width="110" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4"/>
      <text x="645" y="252" fill="#e9d5ff">🔌 MCP Native</text>

      <!-- Tag 4 -->
      <rect x="715" y="235" width="155" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="792" y="252" fill="#93c5fd">🛡️ Human-in-the-Loop</text>
    </g>

    <!-- Bottom Metadata -->
    <text x="600" y="295" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">SaaS Platforms &amp; Self-Hosted Open-Source Frameworks</text>
  </g>
</svg>
